# Buduje podpisany APK Grabio.
#  - push na main: APK jako artefakt (do pobrania z przebiegu),
#  - push tagu vX.Y.Z: APK dołączony do Release (+ changelog z RELEASE_NOTES.md),
#  - ręcznie: Actions -> "Release APK" -> Run workflow.
name: Release APK

on:
  push:
    branches: [main]
    tags: ["v*.*.*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Wersja APK z tagu (np. v1.0.3 → 1.0.3 / versionCode 1000003)
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          VC=$(python3 -c "x,y,z=[int(p) for p in '${TAG}'.split('.')]; print(x*1000000+y*1000+z)")
          sed -i "s/versionCode = [0-9]\+/versionCode = $VC/" app/build.gradle.kts
          sed -i "s/versionName = \"[^\"]*\"/versionName = \"$TAG\"/" app/build.gradle.kts
          grep -nE "versionCode|versionName" app/build.gradle.kts

      - name: Odtworzenie keystore z sekretu
        run: echo "${{ secrets.ANDROID_KEYSTORE_B64 }}" | base64 -d > app/release.keystore

      - name: Budowa i podpisanie APK
        env:
          KEYSTORE_FILE: release.keystore
          KEYSTORE_PASS: ${{ secrets.ANDROID_KEYSTORE_PASS }}
          KEYSTORE_ALIAS: ${{ secrets.ANDROID_KEYSTORE_ALIAS }}
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon

      - name: Nazwij plik APK
        run: cp app/build/outputs/apk/release/app-release.apk Grabio.apk

      - name: Artefakt do pobrania z przebiegu
        uses: actions/upload-artifact@v4
        with:
          name: Grabio-APK
          path: Grabio.apk

      - name: Dodanie APK do Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          body_path: RELEASE_NOTES.md
          files: Grabio.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
